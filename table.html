<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table in CSS</title>
    <style>
        table,tr,th,td{
            border:2px solid black;
            border-collapse: collapse ;
        }
        /* th{
            color:aqua;
            background-color: red;
        } */
         
         tr:hover{
            color:red;
            background-color: blue;
            font-size:30px;
            transition:5s;
            cursor:pointer;
         }
         th:hover{
            color:orange;
            background-color: greenyellow;
            font-size:30px;
            transition:5s;
            cursor:pointer;
         }
         tr:nth-child(odd){
            background-color:aqua;
         }
         tr:nth-child(even){
            background-color:gold;
         }

         

         
    </style>
</head>
<body>
    <table>
        <tr>
            <th>sno </th>
            <th>name </th>
            <th>Roll no</th>
            <th>Section</th>

        </tr>
        <tr>
        <td>04</td>
        <td>Arshad</td>
        <td>12501046</td>
        <td>K25Nz</td>
       </tr>
       <tr>
        <td >05</td>
        <td>Charan Teja</td>
        <td>12501047</td>
        <td>K25NZ</td>
       </tr>
    </table>
</body>
</html>
